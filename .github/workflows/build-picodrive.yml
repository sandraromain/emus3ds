name: Build patched PicoDrive 3DS

on:
  workflow_dispatch:
  push:
    paths:
      - "src/cores/picodrive/3ds/cheats.c"
      - "picodrive3ds_ram_cheats_fix.patch"
      - ".github/workflows/build-picodrive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20230622

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cumulative PicoDrive patch
        run: |
          git apply --check picodrive3ds_ram_cheats_fix.patch
          git apply picodrive3ds_ram_cheats_fix.patch

      - name: Fix software-buffer clear return type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("src/3ds/3dsvideo.h")
          source = Path("src/3ds/3dsvideo.cpp")

          h = header.read_text()
          s = source.read_text()

          old_decl = "void *video3dsClearAllSoftwareBuffers();"
          new_decl = "void video3dsClearAllSoftwareBuffers();"

          old_def = "void *video3dsClearAllSoftwareBuffers()"
          new_def = "void video3dsClearAllSoftwareBuffers()"

          if old_decl not in h:
              raise SystemExit("Expected declaration was not found in 3dsvideo.h")
          if old_def not in s:
              raise SystemExit("Expected definition was not found in 3dsvideo.cpp")

          header.write_text(h.replace(old_decl, new_decl, 1))
          source.write_text(s.replace(old_def, new_def, 1))

          print("Changed video3dsClearAllSoftwareBuffers return type from void* to void")
          PY

      - name: Build PicoDrive
        run: |
          chmod +x makerom/linux_x86_64/makerom || true
          make -f picodrive-make

      - name: Verify clear function has a real return
        run: |
          SYM=$("$DEVKITARM/bin/arm-none-eabi-nm" -n -C picodrive_3ds.elf | \
            awk '/video3dsClearAllSoftwareBuffers/ {print "0x"$1; exit}')
          echo "video3dsClearAllSoftwareBuffers = $SYM"
          test -n "$SYM"

      - name: Collect build output
        run: |
          mkdir -p artifacts
          cp -f picodrive_3ds.cia artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.3dsx artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.elf artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: picodrive3ds-video-return-fix-v18
          path: artifacts/*
          if-no-files-found: error
