name: Build patched PicoDrive 3DS

on:
  workflow_dispatch:
  push:
    paths:
      - "src/cores/picodrive/3ds/cheats.c"
      - "picodrive3ds_ram_cheats_fix.patch"
      - ".github/workflows/build-picodrive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20230622

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cumulative PicoDrive patch
        run: |
          git apply --check picodrive3ds_ram_cheats_fix.patch
          git apply picodrive3ds_ram_cheats_fix.patch

      - name: Apply v21c modern runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text, signature, new_function):
              pos = text.find(signature)
              if pos < 0:
                  raise SystemExit("Could not find function: " + signature)
              brace = text.find("{", pos + len(signature))
              if brace < 0:
                  raise SystemExit("Could not find opening brace: " + signature)
              depth = 0
              i = brace
              while i < len(text):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[:pos] + new_function + text[i+1:]
                  i += 1
              raise SystemExit("Could not find closing brace: " + signature)

          # v18 fix: correct return type.
          header = Path("src/3ds/3dsvideo.h")
          source = Path("src/3ds/3dsvideo.cpp")
          h = header.read_text()
          s = source.read_text()
          old_decl = "void *video3dsClearAllSoftwareBuffers();"
          old_def = "void *video3dsClearAllSoftwareBuffers()"
          if old_decl not in h or old_def not in s:
              raise SystemExit("Expected video clear signatures were not found")
          header.write_text(h.replace(old_decl, "void video3dsClearAllSoftwareBuffers();", 1))
          source.write_text(s.replace(old_def, "void video3dsClearAllSoftwareBuffers()", 1))

          # Compile as release to remove expensive timing/debug output.
          make_path = Path("picodrive-make")
          mk = make_path.read_text()
          if "-DEMU_RELEASE" not in mk:
              if "-DEMU_C68K" not in mk:
                  raise SystemExit("Could not find EMU_C68K build flag")
              mk = mk.replace("-DEMU_C68K", "-DEMU_RELEASE -DEMU_C68K", 1)
          make_path.write_text(mk)

          # Modern NDSP audio.
          sound_path = Path("src/3ds/3dssound.cpp")
          snd = sound_path.read_text()

          globals_marker = "#define SAMPLEBUFFER_SIZE 44100\n"
          ndsp_globals = (
              "\n"
              "#define NDSP_BUFFER_COUNT 3\n"
              "#define NDSP_MAX_SAMPLES_PER_FRAME (44100 / 50)\n"
              "\n"
              "static ndspWaveBuf ndspWaveBufs[NDSP_BUFFER_COUNT];\n"
              "static s16 *ndspAudioBuffer = NULL;\n"
              "static s16 ndspLeftTemp[NDSP_MAX_SAMPLES_PER_FRAME];\n"
              "static s16 ndspRightTemp[NDSP_MAX_SAMPLES_PER_FRAME];\n"
              "static int ndspNextBuffer = 0;\n"
          )
          if globals_marker not in snd:
              raise SystemExit("Could not find SAMPLEBUFFER_SIZE marker")
          snd = snd.replace(globals_marker, globals_marker + ndsp_globals, 1)

          snd = replace_function(
              snd,
              "void snd3dsMixSamples()",
              """void snd3dsMixSamples()
          {
              if (snd3DS.audioType != 2 || !snd3DS.isPlaying || ndspAudioBuffer == NULL)
                  return;

              ndspWaveBuf *wave = &ndspWaveBufs[ndspNextBuffer];
              if (wave->status != NDSP_WBUF_FREE && wave->status != NDSP_WBUF_DONE)
                  return;

              int samples = snd3dsSamplesPerLoop;
              if (samples > NDSP_MAX_SAMPLES_PER_FRAME)
                  samples = NDSP_MAX_SAMPLES_PER_FRAME;

              impl3dsGenerateSoundSamples(samples);
              impl3dsOutputSoundSamples(samples, ndspLeftTemp, ndspRightTemp);

              s16 *dst = (s16 *)wave->data_vaddr;
              for (int i = 0; i < samples; i++)
              {
                  dst[i * 2 + 0] = ndspLeftTemp[i];
                  dst[i * 2 + 1] = snd3dsIsStereo ? ndspRightTemp[i] : ndspLeftTemp[i];
              }

              wave->nsamples = samples;
              wave->looping = false;
              DSP_FlushDataCache((void *)wave->data_vaddr, samples * 2 * sizeof(s16));
              ndspChnWaveBufAdd(0, wave);

              ndspNextBuffer = (ndspNextBuffer + 1) % NDSP_BUFFER_COUNT;
          }"""
          )

          snd = replace_function(
              snd,
              "void snd3dsStartPlaying()",
              """void snd3dsStartPlaying()
          {
              if (snd3DS.audioType != 2 || snd3DS.isPlaying)
                  return;

              ndspChnWaveBufClear(0);
              ndspChnSetRate(0, snd3dsSampleRate);

              memset(ndspWaveBufs, 0, sizeof(ndspWaveBufs));
              for (int i = 0; i < NDSP_BUFFER_COUNT; i++)
              {
                  ndspWaveBufs[i].data_vaddr =
                      &ndspAudioBuffer[i * NDSP_MAX_SAMPLES_PER_FRAME * 2];
                  ndspWaveBufs[i].nsamples = snd3dsSamplesPerLoop;
              }

              ndspNextBuffer = 0;
              snd3DS.isPlaying = true;
          }"""
          )

          snd = replace_function(
              snd,
              "void snd3dsStopPlaying()",
              """void snd3dsStopPlaying()
          {
              if (!snd3DS.isPlaying)
                  return;

              snd3DS.isPlaying = false;
              if (snd3DS.audioType == 2)
                  ndspChnWaveBufClear(0);
          }"""
          )

          snd = replace_function(
              snd,
              "void snd3dsSetSampleRate(",
              """void snd3dsSetSampleRate(
              bool isStereo,
              int idealSampleRate,
              int loopsPerSecond,
              bool spawnMixingThread,
              int minLoopBuffer,
              int maxLoopBuffer)
          {
              snd3dsIsStereo = isStereo;
              if (idealSampleRate > 44100)
                  idealSampleRate = 44100;

              snd3dsSampleRate = snd3dsComputeSampleRate(idealSampleRate, loopsPerSecond);
              snd3dsSamplesPerLoop = snd3dsComputeSamplesPerLoop(idealSampleRate, loopsPerSecond);
              snd3dsSpawnMixingThread = false;
              snd3dsMinLoopBuffer = minLoopBuffer;
              snd3dsMaxLoopBuffer = maxLoopBuffer;

              if (snd3DS.audioType == 2)
                  ndspChnSetRate(0, snd3dsSampleRate);
          }"""
          )

          snd = replace_function(
              snd,
              "bool snd3dsInitialize()",
              """bool snd3dsInitialize()
          {
              snd3DS.isPlaying = false;
              snd3DS.audioType = 0;
              snd3DS.fullBuffers = NULL;
              snd3DS.leftBuffer = NULL;
              snd3DS.rightBuffer = NULL;
              snd3DS.mixingThreadHandle = 0;
              snd3DS.terminateMixingThread = true;
              snd3dsSpawnMixingThread = false;

              Result ret = ndspInit();
              if (R_FAILED(ret))
              {
                  printf("Unable to initialize NDSP: %08lx\\n", (unsigned long)ret);
                  return false;
              }

              ndspAudioBuffer = (s16 *)linearAlloc(
                  NDSP_BUFFER_COUNT * NDSP_MAX_SAMPLES_PER_FRAME * 2 * sizeof(s16));
              if (ndspAudioBuffer == NULL)
              {
                  ndspExit();
                  return false;
              }

              memset(ndspAudioBuffer, 0,
                  NDSP_BUFFER_COUNT * NDSP_MAX_SAMPLES_PER_FRAME * 2 * sizeof(s16));
              memset(ndspWaveBufs, 0, sizeof(ndspWaveBufs));

              ndspSetOutputMode(NDSP_OUTPUT_STEREO);
              ndspChnReset(0);
              ndspChnSetInterp(0, NDSP_INTERP_LINEAR);
              ndspChnSetRate(0, snd3dsSampleRate);
              ndspChnSetFormat(0, NDSP_FORMAT_STEREO_PCM16);

              float mix[12];
              memset(mix, 0, sizeof(mix));
              mix[0] = 1.0f;
              mix[1] = 1.0f;
              ndspChnSetMix(0, mix);

              for (int i = 0; i < NDSP_BUFFER_COUNT; i++)
              {
                  ndspWaveBufs[i].data_vaddr =
                      &ndspAudioBuffer[i * NDSP_MAX_SAMPLES_PER_FRAME * 2];
                  ndspWaveBufs[i].nsamples = snd3dsSamplesPerLoop;
              }

              snd3DS.audioType = 2;
              ndspNextBuffer = 0;
              return true;
          }"""
          )

          snd = replace_function(
              snd,
              "void snd3dsFinalize()",
              """void snd3dsFinalize()
          {
              snd3DS.terminateMixingThread = true;
              snd3dsStopPlaying();

              if (snd3DS.audioType == 2)
              {
                  ndspChnWaveBufClear(0);
                  ndspExit();
              }

              if (ndspAudioBuffer)
              {
                  linearFree(ndspAudioBuffer);
                  ndspAudioBuffer = NULL;
              }

              snd3DS.audioType = 0;
          }"""
          )

          sound_path.write_text(snd)

          # Pump one audio block per emulated frame.
          main_path = Path("src/3ds/3dsmain.cpp")
          m = main_path.read_text()

          frame_call = "        impl3dsEmulationRunOneFrame(firstFrame, skipDrawingFrame);\n"
          if frame_call not in m:
              raise SystemExit("Could not find frame call")
          m = m.replace(frame_call, frame_call + "        snd3dsMixSamples();\n", 1)

          # Remove the old manual service shutdown calls. The exact whitespace
          # differs between historical source revisions, so replace the calls
          # themselves instead of trying to match the whole block.
          legacy_calls = [
              "ptmSysmExit ();",
              "hidExit();",
              "aptExit();",
              "srvExit();",
          ]
          for call in legacy_calls:
              if call not in m:
                  raise SystemExit("Could not find legacy shutdown call: " + call)
              m = m.replace(
                  call,
                  "/* modern libctru: automatic service shutdown */",
                  1
              )

          # Return normally from main, while avoiding the known bad fileList free.
          if "#include <new>\n" not in m:
              m = m.replace("#include <vector>\n", "#include <vector>\n#include <new>\n", 1)

          exit_marker = (
              '    printf ("Exiting...\\n");\n'
              '\texit(0);\n'
              '}'
          )
          exit_replacement = (
              '    new (&fileList) std::vector<std::string>();\n'
              '    printf ("Exiting...\\n");\n'
              '    return 0;\n'
              '}'
          )
          if exit_marker not in m:
              raise SystemExit("Could not find final exit block")
          m = m.replace(exit_marker, exit_replacement, 1)
          main_path.write_text(m)

          print("Applied v18 video return fix")
          print("Enabled EMU_RELEASE")
          print("Replaced CSND with NDSP triple-buffered audio")
          print("Removed legacy manual service shutdown")
          print("Added normal main() return")
          PY

      - name: Build PicoDrive
        run: |
          chmod +x makerom/linux_x86_64/makerom || true
          make -f picodrive-make

      - name: Verify v21c binary and source
        run: |
          "$DEVKITARM/bin/arm-none-eabi-nm" -C picodrive_3ds.elf | grep "video3dsClearAllSoftwareBuffers"
          grep -q -- "-DEMU_RELEASE" picodrive-make
          grep -q "ndspInit" src/3ds/3dssound.cpp
          grep -q "NDSP_FORMAT_STEREO_PCM16" src/3ds/3dssound.cpp
          grep -q "snd3dsMixSamples();" src/3ds/3dsmain.cpp
          grep -q "automatic service shutdown" src/3ds/3dsmain.cpp
          echo "v21c modern runtime fixes verified"

      - name: Collect build output
        run: |
          mkdir -p artifacts
          cp -f picodrive_3ds.cia artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.3dsx artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.elf artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: picodrive3ds-modern-ndsp-v21c
          path: artifacts/*
          if-no-files-found: error
