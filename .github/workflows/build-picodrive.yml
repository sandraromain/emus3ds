name: Build patched PicoDrive 3DS

on:
  workflow_dispatch:
  push:
    paths:
      - "src/cores/picodrive/3ds/cheats.c"
      - "picodrive3ds_ram_cheats_fix.patch"
      - ".github/workflows/build-picodrive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20230622

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cumulative PicoDrive patch
        run: |
          git apply --check picodrive3ds_ram_cheats_fix.patch
          git apply picodrive3ds_ram_cheats_fix.patch

      - name: Apply v19 runtime diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep the v18 fix for the UB in video3dsClearAllSoftwareBuffers().
          header = Path("src/3ds/3dsvideo.h")
          source = Path("src/3ds/3dsvideo.cpp")
          h = header.read_text()
          s = source.read_text()

          old_decl = "void *video3dsClearAllSoftwareBuffers();"
          old_def = "void *video3dsClearAllSoftwareBuffers()"
          if old_decl not in h or old_def not in s:
              raise SystemExit("Expected v18 video clear signatures were not found")
          header.write_text(h.replace(old_decl, "void video3dsClearAllSoftwareBuffers();", 1))
          source.write_text(s.replace(old_def, "void video3dsClearAllSoftwareBuffers()", 1))

          # Add small on-screen stage markers. Bottom-screen double buffering is
          # disabled during emulation, so flushing the current bottom framebuffer
          # makes each marker visible without a full screen swap.
          main_path = Path("src/3ds/3dsmain.cpp")
          m = main_path.read_text()

          globals_marker = "char romFileNameLastSelected[_MAX_PATH];\n\n\n\n"
          debug_helper = '''char romFileNameLastSelected[_MAX_PATH];

static void emuDebugStage(const char *text)
{
    printf("\\x1b[20;0H%-38s", text);
    u8 *fb = gfxGetFramebuffer(GFX_BOTTOM, GFX_LEFT, NULL, NULL);
    if (fb)
        GSPGPU_FlushDataCache(fb, 320 * 240 * 4);
    svcSleepThread(10000000);
}


'''
          if globals_marker not in m:
              raise SystemExit("Could not find globals insertion point")
          m = m.replace(globals_marker, debug_helper, 1)

          start_marker = '''    snd3dsStartPlaying();

    impl3dsEmulationBegin();

\\twhile (true)
\\t{
'''
          start_replacement = '''    emuDebugStage("DBG1 before sound");
    snd3dsStartPlaying();
    emuDebugStage("DBG2 sound started");

    emuDebugStage("DBG3 before emu begin");
    impl3dsEmulationBegin();
    emuDebugStage("DBG4 emu begin done");

    int debugFrameCounter = 0;

\\twhile (true)
\\t{
        debugFrameCounter++;
        if (debugFrameCounter <= 3)
        {
            char dbg[40];
            snprintf(dbg, sizeof(dbg), "DBG frame %d loop start", debugFrameCounter);
            emuDebugStage(dbg);
        }
'''
          if start_marker not in m:
              raise SystemExit("Could not find emulatorLoop start insertion point")
          m = m.replace(start_marker, start_replacement, 1)

          frame_marker = '''        impl3dsEmulationRunOneFrame(firstFrame, skipDrawingFrame);

        firstFrame = false; 
'''
          frame_replacement = '''        if (debugFrameCounter <= 3)
        {
            char dbg[40];
            snprintf(dbg, sizeof(dbg), "DBG frame %d before core", debugFrameCounter);
            emuDebugStage(dbg);
        }

        impl3dsEmulationRunOneFrame(firstFrame, skipDrawingFrame);

        if (debugFrameCounter <= 3)
        {
            char dbg[40];
            snprintf(dbg, sizeof(dbg), "DBG frame %d core done", debugFrameCounter);
            emuDebugStage(dbg);
        }

        firstFrame = false; 
'''
          if frame_marker not in m:
              raise SystemExit("Could not find frame diagnostic insertion point")
          m = m.replace(frame_marker, frame_replacement, 1)

          # The supplied exit dump shows failure in C++ global destruction after
          # the emulator already finalized its 3DS services. At this point the
          # process can terminate directly instead of running global destructors.
          exit_marker = '''    printf ("Exiting...\\\\n");
\\texit(0);
}'''
          exit_replacement = '''    printf ("Exiting...\\\\n");
    svcExitProcess();
}'''
          if exit_marker not in m:
              raise SystemExit("Could not find final exit(0) block")
          m = m.replace(exit_marker, exit_replacement, 1)

          main_path.write_text(m)

          print("Applied v18 clear-return fix")
          print("Added runtime DBG markers")
          print("Changed final exit(0) to svcExitProcess()")
          PY

      - name: Build PicoDrive
        run: |
          chmod +x makerom/linux_x86_64/makerom || true
          make -f picodrive-make

      - name: Verify diagnostic binary
        run: |
          NM="$DEVKITARM/bin/arm-none-eabi-nm"
          "$NM" -C picodrive_3ds.elf | grep "video3dsClearAllSoftwareBuffers"
          "$NM" -C picodrive_3ds.elf | grep "emuDebugStage"
          "$NM" -C picodrive_3ds.elf | grep "svcExitProcess"

      - name: Collect build output
        run: |
          mkdir -p artifacts
          cp -f picodrive_3ds.cia artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.3dsx artifacts/ 2>/dev/null || true
          cp -f picodrive_3ds.elf artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: picodrive3ds-runtime-diagnostic-v19
          path: artifacts/*
          if-no-files-found: error
